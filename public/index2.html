<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sunmarke Multi-Model Voice RAG</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 { font-size: 2.5em; margin-bottom: 10px; }

    .content { padding: 40px; }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      border-bottom: 2px solid #e0e0e0;
    }

    .tab {
      padding: 15px 30px;
      cursor: pointer;
      border: none;
      background: transparent;
      font-size: 1.1em;
      color: #666;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
    }

    .tab.active {
      color: #667eea;
      border-bottom-color: #667eea;
      font-weight: bold;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .input-section {
      background: #f9f9f9;
      padding: 30px;
      border-radius: 10px;
      margin-bottom: 30px;
    }

    .record-button {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: none;
      font-size: 3em;
      cursor: pointer;
      transition: all 0.3s;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
      margin: 20px auto;
      display: block;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .record-button:hover:not(:disabled) { transform: scale(1.05); }

    .record-button.recording {
      background: #f44336;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .record-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .text-input {
      width: 100%;
      padding: 15px;
      font-size: 1.1em;
      border: 2px solid #667eea;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      font-size: 1.1em;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .loading { text-align: center; padding: 40px; display: none; }
    .loading.active { display: block; }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .model-card {
      background: #f9f9f9;
      border-radius: 10px;
      padding: 20px;
      border: 3px solid;
      position: relative;
      min-height: 250px;
    }

    /* Model-specific styling */
    .model-card.gemini   { border-color: #4285f4; }
    .model-card.groq     { border-color: #ff6b6b; }
    .model-card.deepseek { border-color: #4ecdc4; }

    .model-card h3 { margin-bottom: 15px; font-size: 1.3em; }

    .model-card.gemini h3   { color: #4285f4; }
    .model-card.groq h3     { color: #ff6b6b; }
    .model-card.deepseek h3 { color: #4ecdc4; }

    .answer-text {
      background: white;
      padding: 15px;
      border-radius: 8px;
      margin: 15px 0;
      line-height: 1.6;
      min-height: 100px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .model-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100px;
      flex-direction: column;
      gap: 10px;
    }

    .model-spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid currentColor;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
    }

    .model-card.gemini .model-spinner   { border-top-color: #4285f4; }
    .model-card.groq .model-spinner     { border-top-color: #ff6b6b; }
    .model-card.deepseek .model-spinner { border-top-color: #4ecdc4; }

    .audio-player { width: 100%; margin-top: 15px; }

    .status {
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      text-align: center;
    }

    .status.success { background: #e8f5e9; color: #388e3c; }
    .status.error   { background: #ffebee; color: #d32f2f; }

    .question-display {
      background: #e3f2fd;
      padding: 20px;
      border-radius: 10px;
      margin: 20px 0;
      border-left: 4px solid #667eea;
    }

    .question-display h4 { color: #667eea; margin-bottom: 10px; }

    .timer {
      font-family: 'Courier New', monospace;
      font-size: 1.2em;
      margin-top: 10px;
      color: #666;
    }

    .note {
      text-align: center;
      color: #777;
      font-size: 0.95em;
      margin-top: 10px;
    }

    .model-meta {
      font-size: 0.9em;
      color: #666;
      margin-top: -8px;
      margin-bottom: 10px;
    }

    .response-time {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.05);
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 0.85em;
      color: #666;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>🎤 Sunmarke Multi-Model Voice RAG</h1>
      <p>Compare AI responses from 3 different models in real-time</p>
      <p style="font-size: 0.9em; margin-top: 10px;">
        Gemini | Groq Llama | DeepSeek
      </p>
    </div>

    <div class="content">
      <!-- Tabs -->
      <div class="tabs">
        <button id="tabVoice" class="tab active" type="button">🎙️ Voice Input</button>
        <button id="tabText" class="tab" type="button">⌨️ Text Input</button>
      </div>

      <!-- Voice Tab -->
      <div id="voiceTab" class="tab-content active">
        <div class="input-section">
          <h3 style="text-align:center; margin-bottom: 12px;">Record Your Question</h3>
          <p style="text-align:center; color:#666; margin-bottom: 10px;">
            Click once to start, click again to stop (max 30 seconds).
          </p>

          <button id="recordBtn" class="record-button" type="button" aria-label="Record">🎙️</button>
          <div id="timer" class="timer" style="display:none; text-align:center;">00:00</div>
          <div id="micHint" class="note">If asked, allow microphone access.</div>
        </div>
      </div>

      <!-- Text Tab -->
      <div id="textTab" class="tab-content">
        <div class="input-section">
          <h3 style="margin-bottom: 20px;">Type Your Question</h3>
          <input
            type="text"
            id="textInput"
            class="text-input"
            placeholder="e.g., What is the admission process?"
          />
          <button id="textSubmitBtn" class="submit-btn" type="button">
            🎯 Get Answers from All 3 Models
          </button>
        </div>
      </div>

      <!-- Loading -->
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p id="loadingText">Processing...</p>
      </div>

      <!-- Question Display -->
      <div id="questionDisplay" class="question-display" style="display:none;">
        <h4>Your Question:</h4>
        <p id="questionText"></p>
      </div>

      <!-- Status -->
      <div id="status" style="display:none;"></div>

      <!-- Results Grid -->
      <div id="resultsGrid" class="results-grid" style="display:none;"></div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;

    let mediaRecorder = null;
    let audioChunks = [];
    let startTime = null;
    let timerInterval = null;

    const MAX_DURATION = 30;

    // Toggle + anti-spam flags
    let isRecording = false;
    let isBusy = false;

    // Track response times
    const responseTimes = {};

    // ---------- UI helpers ----------
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      if (tab === 'voice') {
        document.getElementById('tabVoice').classList.add('active');
        document.getElementById('voiceTab').classList.add('active');
      } else {
        document.getElementById('tabText').classList.add('active');
        document.getElementById('textTab').classList.add('active');
      }
    }

    function showStatus(message, type) {
      const status = document.getElementById('status');
      status.textContent = message;
      status.className = `status ${type}`;
      status.style.display = 'block';
    }

    function clearStatus() {
      const status = document.getElementById('status');
      status.style.display = 'none';
      status.textContent = '';
      status.className = '';
    }

    function setLoading(on, text = 'Processing...') {
      document.getElementById('loading').classList.toggle('active', on);
      document.getElementById('loadingText').textContent = text;
    }

    function updateTimer() {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const minutes = Math.floor(elapsed / 60);
      const seconds = elapsed % 60;
      document.getElementById('timer').textContent =
        `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;

      if (elapsed >= MAX_DURATION) {
        stopRecording(); // auto stop
      }
    }

    // ---------- Recording ----------
    async function startRecording() {
      clearStatus();

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

        // Prefer webm/opus, fallback to whatever is available
        let options = { mimeType: 'audio/webm;codecs=opus' };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) options = { mimeType: 'audio/webm' };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) options = {};

        mediaRecorder = new MediaRecorder(stream, options);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
          try {
            const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
            await processAudio(blob);
          } finally {
            stream.getTracks().forEach(track => track.stop());
          }
        };

        mediaRecorder.start();
        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 250);

        const btn = document.getElementById('recordBtn');
        btn.classList.add('recording');
        btn.textContent = '⏹️';
        document.getElementById('timer').style.display = 'block';
        document.getElementById('micHint').style.display = 'none';

      } catch (err) {
        isRecording = false;
        showStatus('Error accessing microphone: ' + (err?.message || err), 'error');
      }
    }

    function stopRecording() {
      if (!mediaRecorder || mediaRecorder.state === 'inactive') return;

      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }

      const btn = document.getElementById('recordBtn');
      btn.classList.remove('recording');
      btn.textContent = '🎙️';
      document.getElementById('timer').style.display = 'none';

      mediaRecorder.stop();
    }

    // ---------- Prepare empty cards ----------
    function prepareEmptyCards() {
      const cards = [
        { key: 'gemini',   title: '🔵 Gemini',      css: 'gemini' },
        { key: 'groq',     title: '🔴 Groq Llama',  css: 'groq' },
        { key: 'deepseek', title: '🟢 DeepSeek',    css: 'deepseek' },
      ];

      const grid = document.getElementById('resultsGrid');
      grid.innerHTML = '';

      cards.forEach(c => {
        const card = document.createElement('div');
        card.className = `model-card ${c.css}`;
        card.id = `card-${c.key}`;
        
        let html = `<h3>${c.title}</h3>`;
        html += `<div class="model-meta">Waiting for response...</div>`;
        html += `<div class="model-loading">
          <div class="model-spinner"></div>
          <span>Processing...</span>
        </div>`;
        
        card.innerHTML = html;
        grid.appendChild(card);

        // Track start time
        responseTimes[c.key] = Date.now();
      });

      grid.style.display = 'grid';
    }

    // ---------- Update single card ----------
    function updateCard(key, response) {
      const card = document.getElementById(`card-${key}`);
      if (!card) return;

      const elapsed = ((Date.now() - responseTimes[key]) / 1000).toFixed(2);

      const titles = {
        'gemini': '🔵 Gemini',
        'groq': '🔴 Groq Llama',
        'deepseek': '🟢 DeepSeek'
      };

      const modelMeta = response?.model ? escapeHtml(response.model) : titles[key];

      let html = `<h3>${titles[key]}</h3>`;
      html += `<div class="response-time">⏱️ ${elapsed}s</div>`;
      html += `<div class="model-meta">Backend: <b>${modelMeta}</b></div>`;

      if (response.success) {
        html += `<div class="answer-text">${escapeHtml(response.answer)}</div>`;
        if (response.audio_base64) {
          html += `
            <audio class="audio-player" controls>
              <source src="data:audio/mpeg;base64,${response.audio_base64}" type="audio/mpeg">
            </audio>
          `;
        } else {
          html += `<div class="note">No TTS audio available</div>`;
        }
      } else {
        html += `<div class="answer-text" style="color:#d32f2f;">❌ Error: ${escapeHtml(response.error || 'Unknown error')}</div>`;
      }

      card.innerHTML = html;
    }

    // ---------- API calls ----------
    async function processAudio(audioBlob) {
      const recordBtn = document.getElementById('recordBtn');

      // block spam
      isBusy = true;
      recordBtn.disabled = true;

      setLoading(true, 'Transcribing your voice...');
      document.getElementById('resultsGrid').style.display = 'none';
      document.getElementById('questionDisplay').style.display = 'none';

      try {
        // Convert to wav when possible
        const wavBlob = await convertToWav(audioBlob);

        const formData = new FormData();
        formData.append('audio_file', wavBlob, 'recording.wav');

        setLoading(true, 'Getting answers from all models...');

        const response = await fetch(`${API_BASE}/process-multi`, {
          method: 'POST',
          body: formData
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data?.message || `HTTP ${response.status}`);

        if (data.success) displayResultsStreaming(data);
        else showStatus('Error: ' + (data.message || 'Unknown error'), 'error');

      } catch (err) {
        showStatus('Processing failed: ' + (err?.message || err), 'error');
      } finally {
        setLoading(false);
        isBusy = false;
        isRecording = false;
        recordBtn.disabled = false;
        recordBtn.classList.remove('recording');
        recordBtn.textContent = '🎙️';
      }
    }

    async function submitTextQuestion() {
      clearStatus();

      const query = document.getElementById('textInput').value.trim();
      if (!query) {
        showStatus('Please enter a question', 'error');
        return;
      }

      const btn = document.getElementById('textSubmitBtn');
      btn.disabled = true;

      setLoading(true, 'Getting answers from all models...');
      document.getElementById('resultsGrid').style.display = 'none';
      document.getElementById('questionDisplay').style.display = 'none';

      try {
        const response = await fetch(`${API_BASE}/ask-multi`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data?.message || `HTTP ${response.status}`);

        if (data.success) displayResultsStreaming(data);
        else showStatus('Error: ' + (data.message || 'Unknown error'), 'error');

      } catch (err) {
        showStatus('Failed to get answers: ' + (err?.message || err), 'error');
      } finally {
        setLoading(false);
        btn.disabled = false;
      }
    }

    // ---------- Display results with streaming effect ----------
    function displayResultsStreaming(data) {
      setLoading(false);
      
      // Show question
      document.getElementById('questionText').textContent = data.question || '';
      document.getElementById('questionDisplay').style.display = 'block';

      // Prepare empty cards
      prepareEmptyCards();

      // Update cards as responses arrive (simulate streaming)
      const responses = data.responses || {};
      const keys = ['gemini', 'groq', 'deepseek'];
      
      keys.forEach((key, index) => {
        // Stagger updates slightly to show streaming effect
        setTimeout(() => {
          const response = responses[key];
          if (response) {
            updateCard(key, response);
          } else {
            updateCard(key, {
              success: false,
              error: 'No response received',
              model: key
            });
          }
        }, index * 100); // 100ms delay between cards
      });

      // Show success message after all cards loaded
      setTimeout(() => {
        const successCount = keys.filter(k => responses[k]?.success).length;
        showStatus(`✅ Received ${successCount}/3 successful responses!`, 'success');
      }, 500);
    }

    // ---------- Rendering helpers ----------
    function escapeHtml(str) {
      return String(str ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    // ---------- WAV conversion ----------
    async function convertToWav(blob) {
      try {
        const arrayBuffer = await blob.arrayBuffer();
        const AudioCtx = window.AudioContext || window.webkitAudioContext;

        // 16kHz helps many STT engines
        const audioContext = new AudioCtx({ sampleRate: 16000 });
        const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

        const wavBlob = audioBufferToWav(audioBuffer);

        await audioContext.close();
        return wavBlob;
      } catch (err) {
        console.warn('WAV conversion failed; sending original blob:', err);
        return blob;
      }
    }

    function audioBufferToWav(buffer) {
      const numChannels = buffer.numberOfChannels;
      const sampleRate = buffer.sampleRate;
      const length = buffer.length;

      // Interleave channels
      const interleaved = new Float32Array(length * numChannels);
      let idx = 0;
      for (let i = 0; i < length; i++) {
        for (let ch = 0; ch < numChannels; ch++) {
          interleaved[idx++] = buffer.getChannelData(ch)[i];
        }
      }

      const bytesPerSample = 2;
      const blockAlign = numChannels * bytesPerSample;
      const byteRate = sampleRate * blockAlign;
      const dataSize = interleaved.length * bytesPerSample;

      const bufferSize = 44 + dataSize;
      const arrayBuffer = new ArrayBuffer(bufferSize);
      const view = new DataView(arrayBuffer);

      let pos = 0;
      const writeString = (s) => {
        for (let i = 0; i < s.length; i++) view.setUint8(pos++, s.charCodeAt(i));
      };
      const writeUint16 = (v) => { view.setUint16(pos, v, true); pos += 2; };
      const writeUint32 = (v) => { view.setUint32(pos, v, true); pos += 4; };

      // RIFF header
      writeString('RIFF');
      writeUint32(36 + dataSize);
      writeString('WAVE');

      // fmt chunk
      writeString('fmt ');
      writeUint32(16);
      writeUint16(1); // PCM
      writeUint16(numChannels);
      writeUint32(sampleRate);
      writeUint32(byteRate);
      writeUint16(blockAlign);
      writeUint16(16); // bits

      // data chunk
      writeString('data');
      writeUint32(dataSize);

      // PCM samples
      for (let i = 0; i < interleaved.length; i++) {
        let sample = interleaved[i];
        sample = Math.max(-1, Math.min(1, sample));
        const int16 = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
        view.setInt16(pos, int16, true);
        pos += 2;
      }

      return new Blob([view], { type: 'audio/wav' });
    }

    // ---------- Events ----------
    document.getElementById('tabVoice').addEventListener('click', () => switchTab('voice'));
    document.getElementById('tabText').addEventListener('click', () => switchTab('text'));

    document.getElementById('textSubmitBtn').addEventListener('click', submitTextQuestion);
    document.getElementById('textInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') submitTextQuestion();
    });

    // Toggle record button
    const recordBtn = document.getElementById('recordBtn');
    recordBtn.addEventListener('click', async () => {
      if (isBusy) return;

      if (!isRecording) {
        isRecording = true;
        await startRecording();
      } else {
        isRecording = false;
        stopRecording();
      }
    });
  </script>
</body>
</html>
